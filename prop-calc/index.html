<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout : une colonne façon ticket de trading sur fond noir, halos néon flous en arrière-plan, cartes en verre fumé */
  --bg:#05060a; --surface:rgba(16,18,28,.72); --ink:#eaedf6; --muted:#8a92a8; --line:rgba(255,255,255,.08);
  --accent:#22e6ff; --accent-soft:rgba(34,230,255,.10); --accent-ink:#03141a;
  --good:#39ff9f; --good-soft:rgba(57,255,159,.10); --warn:#ffb84d; --warn-soft:rgba(255,184,77,.10); --bad:#ff3d8b; --bad-soft:rgba(255,61,139,.11);
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --radius:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 10px;font:500 13px var(--font-num)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:700 22px/1.1 var(--font-display);letter-spacing:.01em;margin:0;text-wrap:balance}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px/1.2 var(--font-body);cursor:pointer;text-align:left}
.tab small{display:block;font:500 11px var(--font-body);opacity:.8}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab.add{color:var(--accent);border-style:dashed;background:transparent}
main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font:700 15px/1.2 var(--font-display);margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h3{font:600 14px/1.3 var(--font-body);margin:2px 0 0}
.status{border-radius:var(--radius);padding:14px 16px;border:1px solid var(--line);border-left-width:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.status.good{background:var(--good-soft);border-left-color:var(--good)}
.status.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.status.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.status .label{font:700 14px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.07em}
.status.good .label{color:var(--good)} .status.warn .label{color:var(--warn)} .status.bad .label{color:var(--bad)}
.hero{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.hero h2{color:var(--accent)}
.answer{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum{font:600 64px/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bignum.zero{color:var(--bad)}
.unit{font:700 26px/1 var(--font-display);letter-spacing:.02em}
.answer-sub{font:500 14px/1.5 var(--font-num);margin:0}
.answer-sub b{font-weight:600}
.limit{display:inline-flex;align-self:flex-start;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);line-height:1.25}
.tile .v{font:600 22px/1.1 var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted);line-height:1.3}
.tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--bad)} .tile.good .v{color:var(--good)}
.actions{display:grid;grid-template-columns:1fr 1fr .75fr;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 10px;font:600 14px/1.2 var(--font-body);cursor:pointer;min-height:48px}
.btn small{display:block;font:500 12.5px var(--font-num);opacity:.92;margin-top:2px}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,summary:focus-visible,.seg button:focus-visible,.linkbtn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);line-height:1.25}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 10px;font:500 16px var(--font-num);font-variant-numeric:tabular-nums}
.field select{font-family:var(--font-body);font-size:15px}
.field .hint{font-size:12px;color:var(--muted)}
.field.full{grid-column:1/-1}
.field.big input{font-size:26px;padding:10px 12px;font-weight:600}
.field.big label{font-size:13.5px;color:var(--ink);font-weight:600}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .field{flex:1}
.inline .btn{min-height:42px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:600 12.5px var(--font-num);padding:4px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.chip.tp{color:var(--good);border-color:var(--good)}
.chip.sl{color:var(--bad);border-color:var(--bad)}
.linkbtn{background:none;border:none;color:var(--accent);font:600 13px var(--font-body);padding:4px 2px;cursor:pointer}
.note{font-size:13px;color:var(--muted);margin:0}
.note a,.rules a{color:var(--accent)}
.alert{font-size:13.5px;line-height:1.4;border-radius:8px;padding:10px 12px;margin:0;border-left:4px solid}
.alert.warn{background:var(--warn-soft);color:var(--ink);border-color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--ink);border-color:var(--bad)}
.alert b{font-weight:600}
.seg{display:grid;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{border:0;background:transparent;color:var(--ink);font:600 14px var(--font-body);padding:9px 4px;border-radius:7px;cursor:pointer}
.seg button small{display:block;font:500 11.5px var(--font-num);color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18);color:var(--accent)}
.seg button.blocked{color:var(--muted);text-decoration:line-through}
.bar{position:relative;height:10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px}
.barlabels{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--font-num);color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{font:600 12px/1.25 var(--font-body);color:var(--muted);vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--font-num)}
tr.cur td{background:var(--accent-soft);font-weight:600}
.rate-bad{color:var(--bad);font-weight:600} .rate-warn{color:var(--warn);font-weight:600} .rate-good{color:var(--good);font-weight:600}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules li::marker{color:var(--accent)}
.phase-chip{display:inline-flex;align-self:flex-start;gap:6px;font:600 12.5px var(--font-body);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
details.panel>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font:700 15px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"+";font:600 20px var(--font-num);color:var(--accent)}
details.panel[open]>summary::after{content:"−"}
.group{display:flex;flex-direction:column;gap:10px}
.group+.group{border-top:1px solid var(--line);padding-top:14px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.presets .btn{text-align:left}
.presets .btn small{font-family:var(--font-body);font-weight:400}
.hide{display:none!important}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0;line-height:1.5}
@media (max-width:430px){
  .tile .v{font-size:19px}
  .tiles{gap:6px}
  .tile{padding:9px 8px}
  .bignum{font-size:56px}
  .presets{grid-template-columns:1fr}
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:0 0 auto;border-radius:10px;box-shadow:0 3px 10px rgba(31,79,209,.35)}
.logo .spark{stroke-dasharray:60;animation:draw 1.1s .15s cubic-bezier(.3,.7,.2,1) both}
.logo .b1,.logo .b2,.logo .b3{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.9,.3,1.2) both}
.logo .b2{animation-delay:.08s} .logo .b3{animation-delay:.16s}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.brand-text{display:flex;flex-direction:column;min-width:0}
.tagline{font:500 12px/1.2 var(--font-body);color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s} .enter>*:nth-child(3){animation-delay:.1s} .enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s} .enter>*:nth-child(6){animation-delay:.25s} .enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
.bignum{display:inline-block;transform-origin:left bottom}
.bignum.pop{animation:pop .38s cubic-bezier(.3,.7,.3,1.4)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.shake{animation:shake .42s ease}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent)}100%{box-shadow:0 0 0 16px transparent}}
.glow{animation:glow 1s ease-out 2}
.btn,.tab,.seg button,.sl-row button{transition:transform .1s ease,background-color .2s,color .2s,box-shadow .2s,filter .15s}
.btn:active,.tab:active,.seg button:active,.sl-row button:active{transform:scale(.95)}
.btn.good:active,.btn.bad:active,.btn.primary:active{filter:brightness(1.1)}
.status{transition:background-color .35s,border-color .35s}
.bar i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.sl-row{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.sl-row button{height:54px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 24px var(--font-num);cursor:pointer;touch-action:manipulation}
.sl-row input{text-align:center}
input[type=range]{width:100%;height:30px;accent-color:var(--accent);margin:2px 0 0;cursor:pointer}
.range-scale{display:flex;justify-content:space-between;font:500 11.5px var(--font-num);color:var(--muted);margin-top:-4px}
.viz{display:flex;flex-direction:column;gap:8px}
.slots{display:flex;gap:6px}
.slot{flex:1;height:16px;border-radius:5px;background:var(--bg);border:1px solid var(--line);transition:background-color .25s,border-color .25s,transform .3s cubic-bezier(.3,.7,.3,1.5)}
.slot.on{background:var(--accent);border-color:var(--accent);transform:scaleY(1.2)}
.viz-label{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--font-num);color:var(--muted)}
.meter{position:relative;height:10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--good),var(--warn));transition:width .7s cubic-bezier(.2,.8,.2,1)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font:600 14px var(--font-body);box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1.2);z-index:40;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.validate-panel{border:2px dashed var(--good);background:var(--good-soft)}
.validate-panel h2{color:var(--good)}
.btn.validate{background:var(--good);border-color:var(--good);color:var(--surface);font-size:16px;min-height:56px;width:100%}
.status .btn.validate{margin-top:8px;min-height:48px}
.modal-back{position:fixed;inset:0;background:rgba(8,12,22,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:35;animation:fade .2s ease both}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;padding:24px 20px 20px;max-width:420px;width:100%;max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:zoom .38s cubic-bezier(.2,.9,.3,1.25) both;text-align:center}
.modal h2{font:700 26px/1.15 var(--font-display);color:var(--ink);text-transform:none;letter-spacing:.01em;text-wrap:balance}
.modal p{margin:0;font-size:15px;line-height:1.5}
.modal .rules{text-align:left}
.modal .btn-col{display:flex;flex-direction:column;gap:8px}
.medal{width:104px;height:104px;margin:0 auto;display:block;animation:pop .6s .95s cubic-bezier(.3,.7,.3,1.5) both}
.medal .ring{stroke-dasharray:300;animation:ring .85s .1s ease-out both}
.medal .tick{stroke-dasharray:90;animation:tick .45s .75s ease-out both}
.medal .burst{transform-origin:52px 52px;animation:burst .9s .8s ease-out both}
@keyframes ring{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes tick{from{stroke-dashoffset:90}to{stroke-dashoffset:0}}
@keyframes burst{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.35)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{opacity:0;transform:scale(.82) translateY(10px)}to{opacity:1;transform:none}}
html{background:#05060a}
body{background:transparent}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 85%)}
.glowfield{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.glowfield i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.2;will-change:transform}
.glowfield .o1{background:#22e6ff;top:-28vmax;left:-24vmax;animation:drift1 28s ease-in-out infinite alternate}
.glowfield .o2{background:#8b5cff;top:18vh;right:-34vmax;opacity:.17;animation:drift2 34s ease-in-out infinite alternate}
.glowfield .o3{background:#39ff9f;bottom:-38vmax;left:-6vmax;opacity:.12;animation:drift3 30s ease-in-out infinite alternate}
.glowfield .o4{background:#ff3d8b;bottom:8vh;right:-30vmax;width:38vmax;height:38vmax;opacity:.09;animation:drift2 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-16vmax,-10vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(14vmax,-12vmax) scale(1.08)}}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 5s ease-in-out infinite;opacity:.35}
.spark.c{background:#22e6ff;box-shadow:0 0 8px 2px rgba(34,230,255,.7)}
.spark.g{background:#39ff9f;box-shadow:0 0 8px 2px rgba(57,255,159,.6)}
.spark.v{background:#b69bff;box-shadow:0 0 8px 2px rgba(139,92,255,.6)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.2)}}
header.top{margin:0 calc(-1 * max(16px, env(safe-area-inset-left)));padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right));background:rgba(5,6,10,.7);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-bottom-color:rgba(255,255,255,.06)}
.panel,.status{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.tile{background:rgba(255,255,255,.02)}
.logo{box-shadow:0 0 18px rgba(61,109,255,.55),0 0 2px rgba(34,230,255,.6)}
h1{text-shadow:0 0 18px rgba(34,230,255,.25)}
.hero{border-color:rgba(34,230,255,.5);box-shadow:inset 0 0 0 1px rgba(34,230,255,.25),0 0 34px rgba(34,230,255,.12)}
.hero h2{text-shadow:0 0 12px rgba(34,230,255,.55)}
.bignum{color:#f2fdff;text-shadow:0 0 22px rgba(34,230,255,.6),0 0 3px rgba(34,230,255,.9)}
.bignum.zero{color:var(--bad);text-shadow:0 0 20px rgba(255,61,139,.55)}
.status.good{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),-6px 0 22px -10px rgba(57,255,159,.9)}
.status.warn{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),-6px 0 22px -10px rgba(255,184,77,.9)}
.status.bad{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),-6px 0 22px -10px rgba(255,61,139,.9)}
.status .label{text-shadow:0 0 10px currentColor}
.tab{background:rgba(255,255,255,.04)}
.tab[aria-selected="true"]{color:var(--accent-ink);box-shadow:0 0 18px rgba(34,230,255,.45)}
.btn{background:rgba(255,255,255,.04)}
.btn.good{color:#03140b;box-shadow:0 0 20px rgba(57,255,159,.32)}
.btn.bad{color:#18040c;box-shadow:0 0 20px rgba(255,61,139,.32)}
.btn.primary{color:var(--accent-ink);box-shadow:0 0 18px rgba(34,230,255,.32)}
.btn.validate{color:#03140b;box-shadow:0 0 24px rgba(57,255,159,.38)}

// Nouveau jour : le drawdown EOD suit le solde de clôture (bloqué à taille + 100 $) et les compteurs du jour repartent à zéro.
function rollover(a, today){
  if(a.day === today) return false;
  if(a.autoTrail){
    const lock = a.size + 100;
    if(a.threshold < lock) a.threshold = Math.min(Math.max(a.threshold, a.balance - a.dd), lock);
  }
  a.pnlToday = 0; a.tradesToday = 0; a.log = []; a.day = today;
  const month = today.slice(0, 7);
  if(a.month !== month){ a.month = month; a.monthPnl = 0; a.monthDays = 0; }
  return true;
}

}

function migrateV1(d){
  const map = {apex50:'apex50', lucid50:'lucid50pro', tradeify100:'tradeify100select', custom:'custom'};
  const accts = (d.accounts || []).map(function(o){

    ['balance','threshold','pnlToday','tradesToday','day','method','nR','nSL','fixedR','rr','persoCap','maxTrades','maxSLDay','daysGoal','autoTrail'].forEach(function(k){ if(o[k] !== undefined) a[k] = o[k]; });
    a.log = Array.isArray(o.log) ? o.log : [];
    if(o.instr){ const u = {YM:'DOW',MYM:'DOW',GC:'GOLD',MGC:'GOLD',NQ:'NQ',MNQ:'NQ'}[o.instr]; if(u){ a.und = u; a.useMicro = /^M/.test(o.instr) && o.instr !== 'MNQ' ? true : o.instr === 'MNQ'; if(o.chartSL > 0) a.sl[u] = o.chartSL; } }

}

function setSync(mode){
  syncMode = mode;

}
function touch(){ state.updatedAt = Date.now(); saveLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
async function flush(){
  if(!docRef) return;

  saving = true; setSync('saving');
  const body = JSON.parse(JSON.stringify({v:2, accounts:state.accounts, selected:state.selected, updatedAt:state.updatedAt}));
  try{ await docRef.set(body); setSync('saved'); }
  catch(e){
    if(e && e.code === 'unavailable'){
      await new Promise(function(r){ setTimeout(r, 800 + Math.random()*800); });
      try{ await docRef.set(body); setSync('saved'); }catch(e2){ setSync('local'); }
    } else setSync('local');

  saving = false;
  if(pending){ pending = false; flush(); }
}

(async function initDb(){
  try{
    if(!window.claude || typeof window.claude.use !== 'function') return;

    if(!dbNs || !userNs) return;
    const id = await userNs.id();
    if(!id) return;
    docRef = dbNs.doc('data/users/' + id + '/propcalc2');
    setSync('loading');

      const old = await dbNs.doc('data/users/' + id + '/propcalc').get();
      if(old.exists){ const m = migrateV1(old.data()); if(m) adopt(m); }
    }

})();

/* ----- Mes chances de valider (simulation) ----- */
const simCache = {};
let simJob = null;
function simKey(a){
  return [a.plan, a.phase, a.size, a.target, a.dd, a.dll, a.consistency, a.minDays, a.daysGoal, a.winRate, a.winRR, a.autoTrail, a.firmMax, a.microRatio,
    a.und, a.sl ? a.sl[a.und] : '', a.useMicro, Math.round(riskUnit(a)), a.rr, a.maxTrades, dayTPOf(a, planFor(a))].join('|');
}
// Teste toutes les combinaisons (contrats, RR, trades par jour, TP visés), puis affine les meilleures.
function optimize(a, done){
  const key = simKey(a);
  if(simCache[key]){ done(simCache[key]); return; }
  if(simJob && simJob.key === key){ simJob.done.push(done); return; }
  const snap = JSON.parse(JSON.stringify(a));
  const assumed = snap.winRate == null;
  if(assumed){ snap.winRate = 0.4; snap.winRR = 1.5; }   // sans chiffre : trader sans avantage
  const grid = planGrid(snap);
  const job = {key:key, i:0, res:[], done:[done]};
  simJob = job;
  function step(){
    if(simJob !== job) return;
    const end = Math.min(grid.length, job.i + 30);
    for(; job.i < end; job.i++) job.res.push(Object.assign({}, grid[job.i], simPlan(snap, grid[job.i], 400, 40, 1000 + job.i)));
    const bar = document.getElementById('sim-bar');
    if(bar) bar.style.width = Math.round(job.i / grid.length * 100) + '%';
    if(job.i < grid.length){ setTimeout(step, 0); return; }
    const byFast = job.res.slice().sort(function(x, y){ return y.fast - x.fast || y.all - x.all; }).slice(0, 6);
    const byAll = job.res.slice().sort(function(x, y){ return y.all - x.all || (x.med || 99) - (y.med || 99); }).slice(0, 6);
    const refined = byFast.concat(byAll).map(function(g, j){ return Object.assign({}, g, simPlan(snap, g, 5000, 60, 77 + j)); });
    const fastBest = refined.slice().sort(function(x, y){ return y.fast - x.fast || y.all - x.all; })[0];
    const safeBest = refined.slice().sort(function(x, y){ return y.all - x.all || (x.med || 99) - (y.med || 99); })[0];
    const c = compute(snap), P = planFor(snap);
    const curPlan = {R:riskUnit(snap), rr:snap.rr, N:snap.maxTrades, k:dayTPOf(snap, P), unit:snap.useMicro ? 'micro' : 'mini', n:c.main.used, cost:c.main.used * FEE[snap.useMicro ? 'micro' : 'mini']};
    const result = {fastBest:fastBest, safeBest:safeBest, current:Object.assign({}, curPlan, simPlan(snap, curPlan, 5000, 60, 4242)), tested:grid.length, assumed:assumed};
    simCache[key] = result;
    simJob = null;
    job.done.forEach(function(f){ try{ f(result); }catch(e){} });
  }
  setTimeout(step, 40);
}
function pctTxt(x){ return x < 0.005 ? 'moins de 1 %' : x > 0.95 ? 'plus de 95 %' : pct(x); }
function daysTxt(a){ return pl(Math.max(Math.round(a.daysGoal || 1), minDaysOf(a)), 'jour', 'jours'); }
function samePlan(x, y){ return Math.abs(x.R - y.R) < 1 && x.rr === y.rr && x.N === y.N && x.k === y.k; }
function planDesc(a, g){
  const U = UND[a.und] || UND.DOW, key = g.unit === 'micro' ? U.micro : U.mini, I = INSTR[key];
  const sl = a.sl && a.sl[a.und] > 0 ? a.sl[a.und] : U.defSL;

    (a.dd > 0 && g.R > 0 ? (function(){ const n = Math.ceil(a.dd / (g.R + (g.cost || 0)) - 1e-9); return '<span class="pc-risk' + (n <= 3 ? ' bad' : '') + '">Compte perdu au bout de ' + n + ' stops d’affilée.</span>'; })() : '');
}

  return '<p class="note">Sur 10 trades (TP à ' + num(a.winRR || 1.5, 1) + ' fois ton stop), tu en gagnes combien ?</p><div class="chips">' + [3,4,5,6,7].map(function(v){

function chancesHTML(a){
  if(a.winRate == null) return '<p class="lead-sm">Pour calculer tes vraies chances, il me faut un seul chiffre.</p>' + winChipsHTML(a) +
    '<p class="note">Regarde ton journal de trading ou les résultats de l’algo. Sans ce chiffre, impossible de savoir quel plan est le meilleur pour toi.</p>';

  if(samePlan(r.fastBest, r.current) && samePlan(r.safeBest, r.current)) h += '<p class="alert warn">Ton plan actuel est déjà le meilleur sur les deux tableaux.</p>';
  h += edgeAlert(a);
  h += '<p class="note">' + r.tested + ' plans testés (contrats, RR, trades par jour), chacun simulé des milliers de fois avec les règles de ta firm. On suppose que ton niveau reste le même quand tu changes de RR : ' +
    Math.round(a.winRate * 10) + ' sur 10 à ' + num(a.winRR || 1.5, 1) + 'R, c’est environ ' + num(winProb(a, 2) * 10, 1) + ' sur 10 à 2R et ' + num(winProb(a, 3) * 10, 1) + ' sur 10 à 3R.</p>';
  return h;
}

const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const prevNums = {}, prevBars = {};
let prevSlots = null, enterTimer = null;
function playEnter(){
  if(reduceMotion) return;
  app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
  clearTimeout(enterTimer); enterTimer = setTimeout(function(){ app.classList.remove('enter'); }, 1000);

function parseShown(t){
  const d = t.replace(/[^\d]/g, '');
  if(!d || d.length > 9) return null;
  const neg = t.indexOf('−') >= 0 || /^\s*-/.test(t);
  return {v:(neg ? -1 : 1) * parseInt(d, 10), money:t.indexOf('$') >= 0, plus:t.trim().charAt(0) === '+'};
}
function fmtShown(p, v){
  const r = Math.round(v);
  return (p.plus && r > 0 ? '+' : '') + (p.money ? money(r) : (r < 0 ? '−' : '') + nf(0).format(Math.abs(r)));
}
function keyOf(el, i){ const h = el.closest('[id]'); return (h ? h.id : 'x') + ':' + i; }
function postRender(){
  app.querySelectorAll('.tile .v, .bignum').forEach(function(el, i){
    const p = parseShown(el.textContent);
    if(!p) return;
    const key = keyOf(el, i), from = prevNums[key];
    prevNums[key] = p.v;
    if(from === undefined || from === p.v || reduceMotion) return;
    if(el.classList.contains('bignum')){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    const t0 = performance.now(), dur = 520;
    el.textContent = fmtShown(p, from);
    requestAnimationFrame(function step(now){
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtShown(p, from + (p.v - from) * e);
      if(k < 1) requestAnimationFrame(step);
    });
  });
  app.querySelectorAll('.bar i, .meter i').forEach(function(el, i){
    const key = keyOf(el, i), target = el.style.width, from = prevBars[key];
    prevBars[key] = target;
    if(reduceMotion || from === target) return;
    el.style.transition = 'none'; el.style.width = from === undefined ? '0%' : from; void el.offsetWidth;
    el.style.transition = ''; el.style.width = target;
  });
  const box = app.querySelector('.slots');
  if(box){
    const slots = box.querySelectorAll('.slot'), target = +box.dataset.on;
    const prev = (prevSlots === null || reduceMotion) ? (reduceMotion ? target : 0) : prevSlots;
    if(target >= prev){
      slots.forEach(function(s, i){
        if(i < prev) s.classList.add('on');
        else if(i < target) setTimeout(function(){ s.classList.add('on'); }, 70 * (i - prev) + 40);
      });
    } else {
      slots.forEach(function(s, i){
        if(i < prev) s.classList.add('on');

  } else prevSlots = 0;
}
function syncSL(fromId){
  const a = cur(), v = a.sl[a.und], U = UND[a.und];
  const num = document.getElementById('f-sl'), rng = document.getElementById('f-slr');
  if(num && fromId !== 'f-sl') num.value = toUnit(a.und, v);
  if(rng && fromId !== 'f-slr') rng.value = Math.min(toUnit(a.und, U.max), Math.max(toUnit(a.und, U.min), toUnit(a.und, v)));
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function flash(sel, cls){
  const el = document.querySelector(sel);
  if(!el || reduceMotion) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(function(){ el.classList.remove(cls); }, 2100);
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#1f4fd1'; }
function confetti(n){
  if(reduceMotion) return;
  const cv = document.getElementById('fx'), dpr = window.devicePixelRatio || 1;
  const W = cv.width = Math.round(innerWidth * dpr), H = cv.height = Math.round(innerHeight * dpr);
  const ctx = cv.getContext('2d');
  const cols = [cssVar('--good'), cssVar('--accent'), cssVar('--warn'), '#ffffff'];
  const parts = [];
  for(let i = 0; i < n; i++){
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, sp = (6 + Math.random() * 9) * dpr;
    parts.push({x:W / 2 + (Math.random() - 0.5) * 80 * dpr, y:H * 0.42, vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp,
      r:(3 + Math.random() * 4) * dpr, rot:Math.random() * 6, vr:(Math.random() - 0.5) * 0.4, c:cols[i % cols.length]});
  }
  const t0 = performance.now();
  requestAnimationFrame(function frame(now){
    const k = (now - t0) / 1500;
    ctx.clearRect(0, 0, W, H);
    parts.forEach(function(p){
      p.vy += 0.32 * dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
    });
    if(k < 1) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  });
}
function celebrate(kind){
  const a = cur(), c = compute(a);
  if(kind === 'tp'){
    buzz(15);
    if(c.remaining <= 0 || c.dayDone){ confetti(160); flash('#o-status', 'glow'); toast(c.remaining <= 0 ? 'Objectif atteint, bravo. On coupe.' : 'Objectif du jour atteint. On coupe.'); }
    else { confetti(60); toast('TP enregistré : +' + money(c.TP)); }
  } else if(kind === 'sl'){
    buzz([30, 40, 30]); flash('.hero', 'shake'); flash('#o-status', 'shake');
    toast(c.slLeftToday === 0 ? 'SL enregistré. Stop pour aujourd’hui.' : 'SL enregistré. Encore ' + pl(c.slLeftToday, 'SL possible', 'SL possibles') + '.');
  } else if(kind === 'be'){ buzz(10); toast('Break-even enregistré'); }
  else if(kind === 'custom'){ buzz(10); toast('Trade enregistré'); }
  else if(kind === 'undo'){ toast('Dernier trade annulé'); }
}

/* ---------- Validation du compte ---------- */
function openModal(html){
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back'; back.id = 'modal';
  back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' + html + '</div>';
  back.addEventListener('click', function(e){ if(e.target === back) closeModal(); });
  document.body.appendChild(back);
  const f = back.querySelector('.btn'); if(f) f.focus();
}
function closeModal(){ const m = document.getElementById('modal'); if(m) m.remove(); }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });
function fundedPhases(a){ const P = PLANS[a.plan] || PLANS.custom; return Object.keys(P.phases).filter(function(k){ return k !== 'eval'; }); }
function confirmValidateHTML(a){
  const P = PLANS[a.plan] || PLANS.custom, keys = fundedPhases(a);
  const btns = keys.map(function(k){
    return '<button class="btn validate" data-act="validate-confirm" data-k="' + k + '">' + (keys.length > 1 ? 'Oui, passer en ' + P.phases[k].label : 'Oui, passer en compte financé') + '</button>';
  }).join('');
  return '<h2 id="modal-title">Tu as validé ' + esc(a.name) + ' ?</h2>' +
    '<p>On passe ce compte en <b>financé</b> : les règles changent, le solde repart à ' + money(a.size) + ' et tu passes sur un objectif par mois.</p>' +
    (keys.length > 1 ? '<p class="note">Choisis le mode de retrait que tu as pris chez la firm.</p>' : '') +
    '<div class="btn-col">' + btns + '<button class="btn ghost" data-act="modal-close">Pas encore</button></div>';
}
function successHTML(a){
  const ph = phaseOf(a);
  return '<svg class="medal" viewBox="0 0 104 104" aria-hidden="true">' +
      '<g class="burst" stroke="var(--warn)" stroke-width="4" stroke-linecap="round"><line x1="52" y1="4" x2="52" y2="14"/><line x1="52" y1="90" x2="52" y2="100"/><line x1="4" y1="52" x2="14" y2="52"/><line x1="90" y1="52" x2="100" y2="52"/><line x1="18" y1="18" x2="25" y2="25"/><line x1="79" y1="79" x2="86" y2="86"/><line x1="86" y1="18" x2="79" y2="25"/><line x1="25" y1="79" x2="18" y2="86"/></g>' +
      '<circle cx="52" cy="52" r="34" fill="var(--good-soft)"/>' +
      '<circle class="ring" cx="52" cy="52" r="34" fill="none" stroke="var(--good)" stroke-width="6" stroke-linecap="round" transform="rotate(-90 52 52)"/>' +
      '<path class="tick" d="M37 53 L48 64 L68 42" fill="none" stroke="var(--good)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '<h2 id="modal-title">Félicitations, compte validé !</h2>' +
    '<p><b>' + esc(a.name) + '</b> passe en <b>' + ph.label + '</b>. Nouvelle étape : régularité et discipline, pour aller chercher les retraits.</p>' +
    '<ul class="rules">' + ph.rules.slice(0, 3).map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
    '<div class="btn-col"><button class="btn validate" data-act="wiz-goal">Régler mon objectif du mois</button><button class="btn ghost" data-act="modal-close">Plus tard</button></div>';
}
function celebrateValidation(){
  buzz([40, 60, 40, 60, 120]);
  confetti(220);
  setTimeout(function(){ confetti(140); }, 650);
  setTimeout(function(){ confetti(140); }, 1300);
}

/* ---------- Interactions ---------- */
const INT_FIELDS = {nR:1, nSL:1, persoCap:1, maxTrades:1, maxSLDay:1, daysGoal:1, minDays:1, firmMax:1, tradesToday:1, microRatio:1, tradingDays:1, tpPerDay:1};
function resetForPhase(a){
  applyPhase(a);
  a.balance = a.size; a.threshold = a.size - a.dd; a.pnlToday = 0; a.tradesToday = 0; a.log = [];
}
function onFieldChange(el){
  const f = el.dataset.f;
  if(f === 'customPnl') return;
  const a = cur();
  if(el.type === 'checkbox'){ a[f] = el.checked; renderOutputs(); render(); touch(); return; }
  if(f === 'name'){ a.name = el.value; renderTabs(); touch(); return; }
  if(f === 'method'){ a.method = el.value; renderOutputs(); touch(); return; }
  if(f === 'plan'){ a.plan = el.value; a.phase = 'eval'; a.name = PLANS[a.plan].short; resetForPhase(a); ui.settingsOpen = true; render(); touch(); return; }
  if(f === 'phase'){
    a.phase = el.value; resetForPhase(a);
    a.goalMode = isEval(a) ? 'validate' : 'monthly';
    ui.settingsOpen = true; render(); touch(); return;
  }
  if(f === 'goalMode'){ a.goalMode = el.value; ui.settingsOpen = true; render(); touch(); return; }
  let v = parseNum(el.value);
  if(!isFinite(v)) return;
  if(INT_FIELDS[f]) v = Math.max(0, Math.round(v));
  if((f === 'rr' || f === 'sl') && v <= 0) return;
  if(f === 'sl'){ a.sl[a.und] = Math.round(fromUnit(a.und, v) * 10000) / 10000; syncSL(el.id); } else a[f] = v;
  renderOutputs();
  touch();
}
app.addEventListener('input', function(e){ const t = e.target; if(t.dataset && t.dataset.f && t.type !== 'checkbox' && t.tagName !== 'SELECT') onFieldChange(t); });
app.addEventListener('change', function(e){ const t = e.target; if(t.dataset && t.dataset.f && (t.type === 'checkbox' || t.tagName === 'SELECT')) onFieldChange(t); });

function addTrade(a, label, v){
  v = round2(v);
  if(a.tradesToday === 0) a.monthDays = (a.monthDays || 0) + 1;
  a.balance = round2(a.balance + v);
  a.pnlToday = round2(a.pnlToday + v);
  a.monthPnl = round2((a.monthPnl || 0) + v);
  a.tradesToday += 1;
  a.log.push({t:label, v:v});
}

function handleAct(btn){
  const act = btn.dataset.act;
  if(act !== 'delete') ui.confirmDelete = false;
  if(wizAct(act, btn)) return;
  switch(act){
    case 'tab': ui.tab = btn.dataset.k; render({enter:true}); window.scrollTo(0, 0); return;
    case 'unit': if(state.unitMode !== btn.dataset.k){ state.unitMode = btn.dataset.k; render(); touch(); toast(btn.dataset.k === 'ticks' ? 'Stops affichés en ticks' : 'Stops affichés en points'); } return;
    case 'wiz-open': wizOpen('edit'); return;
    case 'wiz-goal': wizOpen('goal'); return;
    case 'select': state.selected = btn.dataset.id; ui.wiz = null; ui.adding = false; ui.settingsOpen = false; prevSlots = null; render({enter:true}); touch(); return;
    case 'add': wizOpen('new'); return;
    case 'cancel-add': ui.adding = false; render(); return;
    case 'create': { const n = makeAccount(btn.dataset.k); state.accounts.push(n); state.selected = n.id; ui.adding = false; prevSlots = null; render({enter:true}); touch(); toast('Compte ajouté'); return; }
  }
  const a = cur();
  const c = compute(a);
  let effect = null;
  switch(act){
    case 'sl-dec': case 'sl-inc': {
      const U = UND[a.und];
      const nv = Math.round(((a.sl[a.und] || U.defSL) + (act === 'sl-inc' ? U.bstep : -U.bstep)) * 100) / 100;
      a.sl[a.und] = Math.max(U.rstep, nv); syncSL(''); renderOutputs(); touch(); buzz(5); return;
    }
    case 'set-win': a.winRate = +btn.dataset.k / 10; if(!a.winRR) a.winRR = a.rr; break;
    case 'use-plan':
      a.method = 'fixed'; a.fixedR = +btn.dataset.r; a.rr = +btn.dataset.rr; a.maxTrades = +btn.dataset.n; a.dayTP = +btn.dataset.k; a.maxSLDay = Math.max(1, +btn.dataset.n);
      a.useMicro = btn.dataset.u === 'micro';
      a.persoCap = a.useMicro ? Math.max(1, Math.ceil(+btn.dataset.c / (a.microRatio || 10))) : Math.max(1, +btn.dataset.c);
      toast('Nouveau plan appliqué'); confetti(40); break;
    case 'set-days': a.daysGoal = +btn.dataset.k; toast('Plan recalculé sur ' + pl(a.daysGoal,'jour','jours')); break;
    case 'set-month': a.monthlyGoal = +btn.dataset.k; toast('Objectif du mois : ' + money(a.monthlyGoal)); break;
    case 'und': a.und = btn.dataset.k; break;
    case 'size': a.useMicro = btn.dataset.k === 'micro'; break;
    case 'log-tp': if(c.TP > 0){ addTrade(a, 'TP', c.TP); effect = 'tp'; } break;
    case 'log-sl': if(c.R > 0){ addTrade(a, 'SL', -c.R); effect = 'sl'; } break;
    case 'log-be': addTrade(a, 'BE', 0); effect = 'be'; break;
    case 'log-custom': {
      const inp = document.getElementById('f-customPnl');
      const v = parseNum(inp.value);
      if(!isFinite(v)){ inp.focus(); return; }
      addTrade(a, 'Trade', v); effect = 'custom';
      break;
    }
    case 'undo': {
      const e = a.log.pop(); if(e) effect = 'undo';
      if(e){
        a.balance = round2(a.balance - e.v); a.pnlToday = round2(a.pnlToday - e.v); a.monthPnl = round2((a.monthPnl || 0) - e.v);
        a.tradesToday = Math.max(0, a.tradesToday - 1);
        if(a.tradesToday === 0) a.monthDays = Math.max(0, (a.monthDays || 0) - 1);
      }
      break;
    }
    case 'validate-open': openModal(confirmValidateHTML(a)); return;
    case 'modal-close': closeModal(); return;
    case 'validate-confirm': {
      const k = btn.dataset.k;
      const P = PLANS[a.plan] || PLANS.custom;
      if(!P.phases[k]) return;
      a.phase = k; resetForPhase(a); a.goalMode = 'monthly'; a.validatedAt = todayStr();
      ui.settingsOpen = false; prevSlots = null;
      render({enter:true}); touch();
      openModal(successHTML(a)); celebrateValidation();
      return;
    }
    case 'reset-rules': applyPhase(a); ui.settingsOpen = true; break;
    case 'export': {
      const code = JSON.stringify({v:2, accounts:state.accounts, selected:state.selected, updatedAt:state.updatedAt});
      const box = document.getElementById('io-box'), msg = document.getElementById('io-msg');
      box.value = code;
      try{ navigator.clipboard.writeText(code).then(function(){ msg.textContent = 'Code copié. Colle-le sur l’autre appareil.'; }, function(){ box.select(); msg.textContent = 'Sélectionne le code et copie-le.'; }); }
      catch(e){ box.select(); msg.textContent = 'Sélectionne le code et copie-le.'; }
      return;
    }
    case 'import': {
      const msg = document.getElementById('io-msg');
      try{
        const d = JSON.parse(document.getElementById('io-box').value.trim());
        if(!validState(d)) throw new Error('vide');
        d.updatedAt = Date.now(); adopt(d); ui.settingsOpen = false; return;
      }catch(e){ msg.textContent = 'Code invalide : recopie-le en entier depuis l’autre appareil.'; return; }
    }
    case 'delete': {
      if(!ui.confirmDelete){ ui.confirmDelete = true; btn.textContent = 'Confirmer la suppression'; return; }
      ui.confirmDelete = false;
      state.accounts = state.accounts.filter(function(x){ return x.id !== a.id; });
      if(!state.accounts.length) state.accounts.push(makeAccount('custom'));
      state.selected = state.accounts[0].id;
      ui.settingsOpen = false;
      break;
    }
    default: return;
  }
  render();
  touch();
  if(effect) celebrate(effect);
}
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-act]');
  if(btn && !btn.disabled) handleAct(btn);
});

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  const t = todayStr();
  let changed = false;
  state.accounts.forEach(function(a){ if(rollover(a, t)) changed = true; });
  if(changed){ render(); touch(); }
});

// Mise à jour automatique : compare la version en ligne et recharge l'appli si elle a changé.
const APP_VERSION = '11';
function checkUpdate(){
  fetch('version.json?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    if(!d || !d.v || d.v === APP_VERSION) return;
    let done = ''; try{ done = sessionStorage.getItem('sw-reloaded') || ''; }catch(e){}
    if(done === d.v) return;
    try{ sessionStorage.setItem('sw-reloaded', d.v); }catch(e){}
    toast('Nouvelle version, mise à jour…');
    setTimeout(function(){ location.reload(); }, 900);
  }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') checkUpdate(); });
setTimeout(checkUpdate, 1500);
render({enter:true});
// Animation d'ouverture : disparaît d'elle-même, ou au toucher.
(function(){
  const sp = document.getElementById('splash');
  if(!sp) return;
  let gone = false;
  function hide(){ if(gone) return; gone = true; sp.classList.add('out'); playEnter(); setTimeout(function(){ sp.remove(); }, 480); }
  sp.addEventListener('click', hide);
  setTimeout(hide, reduceMotion ? 250 : 2500);
})();
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
